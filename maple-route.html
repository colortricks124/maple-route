<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Maple Route</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#162033;--muted:#5a6578;--line:#dbe1ea;--accent:#1f4aa8;--bad:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#0f141c;--card:#18202c;--ink:#e8edf5;--muted:#9aa6b8;--line:#2a3445;--accent:#7ea2ff;--bad:#ff8a7a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center}
.lock{font-size:34px;line-height:1}
h1{font-size:20px;margin:12px 0 4px}
p{color:var(--muted);font-size:14px;margin:0 0 18px}
input[type=password]{width:100%;font-size:24px;letter-spacing:.4em;text-align:center;padding:12px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted);margin:12px 0}
button{width:100%;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form id="f" autocomplete="off" onsubmit="return false">
  <div class="lock">🔒</div>
  <h1>Maple Route</h1>
  <p>請輸入密碼查看行程</p>
  <input id="pw" type="password" inputmode="numeric" autofocus aria-label="密碼">
  <label><input id="keep" type="checkbox"> 在這台裝置記住密碼</label>
  <button id="go" type="submit" disabled>載入中…</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const SALT = "ImRcuIjmNSw+2/a6p6xzTQ==", ITER = 600000, MARK = "KYU5-OK\n";
let BLOB = null;
const KEY = 'maple-route-pw';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64(SALT), iterations:ITER}, base, 256));
  const key = await crypto.subtle.importKey('raw', bits, 'AES-CBC', false, ['decrypt']);
  let txt;
  try {
    const raw = b64(BLOB);
    const gz = await crypto.subtle.decrypt({name:'AES-CBC', iv:raw.slice(0,16)}, key, raw.slice(16));
    const stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    txt = await new Response(stream).text();
  }
  catch(e){ return null; }
  if (!txt.startsWith(MARK)) return null;
  const k64 = btoa(String.fromCharCode(...bits));
  return txt.slice(MARK.length).replace('__MRK__', k64);
}
function show(html){ document.open(); document.write(html); document.close(); }

const f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'),
      err = document.getElementById('err'), keep = document.getElementById('keep');

f.addEventListener('submit', async e => {
  e.preventDefault();
  if (!pw.value || !BLOB) return;
  go.disabled = true; go.textContent = '解鎖中…'; err.textContent = '';
  const html = await unlock(pw.value);
  if (html){
    try { keep.checked ? localStorage.setItem(KEY, pw.value) : localStorage.removeItem(KEY); } catch(_){}
    show(html);
  } else {
    go.disabled = false; go.textContent = '打開'; err.textContent = '密碼不對，再試一次'; pw.select();
  }
});

  BLOB = blob;
  // 背景先抓加密圖片（只是亂碼），解鎖後直接從快取取用

  if (!saved) return;
